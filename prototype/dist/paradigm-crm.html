<style>/* Layout: fixed side rail (start edge) + sticky top bar + scrolling work area; dense, scan-first operations UI */
:root {
  --ink: #12303a;          /* side rail, headings */
  --ink-2: #1d4552;
  --rust: #c2531b;         /* container-rust accent */
  --rust-soft: #f6e3d8;
  --bg: #f2f5f5;           /* teal-biased neutral page */
  --surface: #ffffff;
  --surface-2: #f7f9f9;
  --line: #dbe3e4;
  --fg: #16262b;
  --muted: #5d7076;
  --ok: #1f7a4d;   --ok-soft: #dcefe4;
  --warn: #a86a00; --warn-soft: #fbedd0;
  --bad: #b3261e;  --bad-soft: #f8dcd9;
  --info: #22608a; --info-soft: #dce9f3;
  --rail-fg: #cfe0e3;
  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #0a1a1f; --ink-2: #163640; --rust: #e2804c; --rust-soft: #3b2418;
    --bg: #0e1a1d; --surface: #152428; --surface-2: #1a2c31; --line: #2a3f45;
    --fg: #e2ecee; --muted: #93a8ad;
    --ok: #5cc28c; --ok-soft: #173326; --warn: #e3b04b; --warn-soft: #3a2d12;
    --bad: #f0857c; --bad-soft: #3d1c1a; --info: #78b4dc; --info-soft: #16303f;
    --rail-fg: #b8ccd0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #0a1a1f; --ink-2: #163640; --rust: #e2804c; --rust-soft: #3b2418;
  --bg: #0e1a1d; --surface: #152428; --surface-2: #1a2c31; --line: #2a3f45;
  --fg: #e2ecee; --muted: #93a8ad;
  --ok: #5cc28c; --ok-soft: #173326; --warn: #e3b04b; --warn-soft: #3a2d12;
  --bad: #f0857c; --bad-soft: #3d1c1a; --info: #78b4dc; --info-soft: #16303f;
  --rail-fg: #b8ccd0; color-scheme: dark;
}

/* Bootstrap bridge */
:root, [data-bs-theme] {
  --bs-body-font-family: var(--font);
  --bs-body-bg: var(--bg);
  --bs-body-color: var(--fg);
  --bs-border-color: var(--line);
  --bs-secondary-color: var(--muted);
  --bs-tertiary-bg: var(--surface-2);
  --bs-secondary-bg: var(--surface-2);
  --bs-emphasis-color: var(--fg);
  --bs-link-color: var(--info);
  --bs-link-hover-color: var(--rust);
  --bs-link-color-rgb: 34, 96, 138;
  --bs-primary: var(--rust);
  --bs-card-bg: var(--surface);
}
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 1040; background: var(--surface); }

.btn-primary { --bs-btn-bg: var(--rust); --bs-btn-border-color: var(--rust); --bs-btn-hover-bg: #a8461a; --bs-btn-hover-border-color: #a8461a; --bs-btn-active-bg: #8f3c16; --bs-btn-color: #fff; --bs-btn-hover-color: #fff; --bs-btn-disabled-bg: var(--rust); --bs-btn-disabled-border-color: var(--rust); }
.btn-outline-primary { --bs-btn-color: var(--rust); --bs-btn-border-color: var(--rust); --bs-btn-hover-bg: var(--rust); --bs-btn-hover-border-color: var(--rust); --bs-btn-hover-color: #fff; --bs-btn-active-bg: var(--rust); }
.btn-light { --bs-btn-bg: var(--surface-2); --bs-btn-border-color: var(--line); --bs-btn-color: var(--fg); --bs-btn-hover-bg: var(--line); --bs-btn-hover-color: var(--fg); }
.form-control, .form-select { background-color: var(--surface); border-color: var(--line); color: var(--fg); }
.form-control:focus, .form-select:focus, .btn:focus-visible, a:focus-visible { border-color: var(--rust); box-shadow: 0 0 0 .2rem color-mix(in srgb, var(--rust) 25%, transparent); outline: none; }
.form-check-input:checked { background-color: var(--rust); border-color: var(--rust); }
.table { --bs-table-bg: transparent; --bs-table-color: var(--fg); --bs-table-border-color: var(--line); --bs-table-hover-bg: var(--surface-2); --bs-table-hover-color: var(--fg); margin: 0; }
.table > thead th { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; white-space: nowrap; background: var(--surface-2); }
.modal-content, .offcanvas, .dropdown-menu { background: var(--surface); color: var(--fg); border-color: var(--line); }
.dropdown-item { color: var(--fg); }
.dropdown-item:hover { background: var(--surface-2); color: var(--fg); }
.nav-tabs { --bs-nav-tabs-border-color: var(--line); --bs-nav-tabs-link-active-bg: var(--surface); --bs-nav-tabs-link-active-color: var(--fg); --bs-nav-tabs-link-active-border-color: var(--line) var(--line) var(--surface); }
.nav-tabs .nav-link { color: var(--muted); white-space: nowrap; }
.nav-tabs { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
.progress { background: var(--surface-2); }
.progress-bar { background: var(--rust); }

/* Shell */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.rail { background: var(--ink); color: var(--rail-fg); position: sticky; top: 0; height: 100vh; overflow-y: auto; padding-block: 16px; display: flex; flex-direction: column; }
.rail .brand { display: flex; align-items: center; gap: 10px; padding: 4px 18px 18px; color: #fff; font-weight: 700; font-size: 15px; }
.brand-mark { width: 30px; height: 30px; border-radius: 6px; background: var(--rust); display: grid; place-items: center; font-family: var(--mono); font-size: 12px; color: #fff; flex: none; }
.rail .group { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; padding: 14px 18px 6px; }
.rail a { display: flex; align-items: center; gap: 10px; padding: 8px 18px; color: var(--rail-fg); text-decoration: none; border-inline-start: 3px solid transparent; }
.rail a:hover { background: var(--ink-2); color: #fff; }
.rail a.active { background: var(--ink-2); color: #fff; border-inline-start-color: var(--rust); }
.rail a .count { margin-inline-start: auto; font-family: var(--mono); font-size: 11px; background: rgba(255,255,255,.12); border-radius: 10px; padding: 1px 7px; }

// ---------- State ----------
const STORE_KEY = "pc-crm-demo-v1";
let DB, ROLE = "admin";
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function loadState() {
  DB = clone(SEED);
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const s = JSON.parse(raw); if (s.db) DB = s.db; if (s.role) ROLE = s.role; if (s.lang) LANG = s.lang; }
  } catch (e) { /* storage unavailable: run in memory */ }
}
function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ db: DB, role: ROLE, lang: LANG })); } catch (e) {} }
function resetDemo() { DB = clone(SEED); saveState(); toast(t("reset_demo")); render(); }

// ---------- Helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function esc(v) { return String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function tx(o) { return o == null ? "" : typeof o === "string" ? o : (o[LANG] ?? o.en ?? ""); }
function me() { return DB.users.find(u => u.id === DB.roleUser[ROLE]); }
function user(id) { return DB.users.find(u => u.id === id); }
function uname(id) { const u = user(id); return u ? tx(u.name) : "—"; }
function client(id) { return DB.clients.find(c => c.id === id); }
function vendor(id) { return DB.vendors.find(v => v.id === id); }
function file(id) { return DB.files.find(f => f.id === id); }
function port(code) { return DB.ports[code] ? tx(DB.ports[code]) : (code || "—"); }
function isAdmin() { return ROLE === "admin"; }
function roleName(r) { return t("role_" + r); }

function fdate(iso) { if (!iso) return "—"; const [d, tm] = iso.split(" "); const [y, m, dd] = d.split("-"); return `${dd}/${m}/${y}` + (tm ? " " + tm : ""); }
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }

// Same rules as FileStageService gates on the server.
function gateProblems(f) {
  const p = [];
  const st = STAGES[f.stage - 1];
  st.items.forEach(it => { if (it[1] && !f.checks[it[0]]) p.push(t("gate_need_check", { item: t(it[0]) })); });
  if (f.stage === 1 && inquiryProblems(f).length) p.push(t("gate_need_rfq"));
  if (f.stage === 3) { const needsBooking = f.ship?.carrier || f.service === "land" || f.addons.includes("truck"); if (needsBooking && !f.checks.c3_booking) p.push(t("gate_need_check", { item: t("c3_booking") })); }
  if (f.stage === 4) {
    const s = f.ship || {};
    if (!s.bl) p.push(t("gate_need_bl")); if (!s.atd) p.push(t("gate_need_etd")); if (!s.eta) p.push(t("gate_need_eta")); if (!s.carrier) p.push(t("gate_need_carrier"));
    const b = openBlockers(f); if (b) p.push(t("gate_need_blockers", { n: b }));
  }

// Mirrors InquiryValidator::problems() on the server.
function inquiryProblems(f) {
  const p = [], q = f.inq || {};
  if (!f.client) p.push(t("p_client"));
  if (!f.service) p.push(f.addons?.includes("ins") && f.addons.length === 1 ? t("p_ins_alone") : t("p_service"));
  const rows = q.rows || [];
  if (!rows.length) p.push(t("p_rows"));
  rows.forEach((r, i) => {
    let ok = true;
    if (f.service === "fcl" || f.service === "se") ok = r.type && r.count > 0;
    else if (["lcl", "air", "courier"].includes(f.service)) ok = r.pieces > 0 && r.l > 0 && r.w > 0 && r.h > 0 && r.kg > 0;
    else if (f.service === "land") ok = r.truck && r.count > 0 && r.kg > 0;
    else if (f.service === "bulk") ok = r.tonnes > 0;
    else if (f.service === "roro") ok = r.count > 0 && r.kg > 0;
    if (!ok) p.push(t("p_row_incomplete", { n: i + 1 }));
  });
  if (!f.origin) p.push(t("p_origin")); if (!f.dest) p.push(t("p_dest")); if (!f.incoterm) p.push(t("p_incoterm"));
  if (f.incoterm === "EXW" && !f.pickup) p.push(t("p_exw"));
  if (f.addons?.includes("truck") && !f.delivery) p.push(t("p_delivery"));
  if (!q.ready) p.push(t("p_ready")); else if (q.ready < TODAY && f.stage <= 1) p.push(t("p_ready_past"));
  if (q.cargo === "haz" && !(q.un && q.imo && q.pg && q.msds)) p.push(t("p_haz"));
  if (q.cargo === "reefer" && (q.temp === "" || q.temp == null)) p.push(t("p_temp"));
  if ((f.service === "fcl" || f.service === "se") && !q.free) p.push(t("p_free"));
  if (q.pay === "credit" && !q.credit_days) p.push(t("p_credit"));
  return p;
}

function chargeable(service, r) {
  const cbm = (r.l * r.w * r.h * (r.pieces || 1)) / 1e6;
  if (service === "lcl") return { v: Math.max(cbm, (r.kg || 0) / 1000), u: "W/M", cbm };
  if (service === "air") return { v: Math.max(r.kg || 0, (r.l * r.w * r.h * (r.pieces || 1)) / 6000), u: "kg", cbm };
  if (service === "courier") { const v = Math.max(r.kg || 0, (r.l * r.w * r.h * (r.pieces || 1)) / 5000); return { v: Math.ceil(v * 2) / 2, u: "kg", cbm }; }
  return null;
}
function volumeSummary(f) {
  const rows = f.inq?.rows || [];
  if (f.service === "fcl" || f.service === "se") return rows.map(r => `${r.count}×${r.type}`).join(", ");
  if (["lcl", "air", "courier"].includes(f.service)) return rows.map(r => { const c = chargeable(f.service, r); return `${r.pieces} pcs · ${NF.format(r.kg)} kg` + (c ? ` · ${NF.format(c.v)} ${c.u === "W/M" ? "W/M" : "kg ch."}` : ""); }).join("; ");
  return "";
}

// ---------- Total in words ----------
function enWords(n) {
  const a = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
  const b = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
  const h = x => { let s = ""; if (x >= 100) { s += a[Math.floor(x / 100)] + " hundred"; x %= 100; if (x) s += " and "; } if (x >= 20) { s += b[Math.floor(x / 10)]; if (x % 10) s += "-" + a[x % 10]; } else if (x) s += a[x]; return s; };
  if (n === 0) return "zero";
  const parts = []; const sc = [[1e9, "billion"], [1e6, "million"], [1e3, "thousand"]];
  for (const [v, w] of sc) if (n >= v) { parts.push(h(Math.floor(n / v)) + " " + w); n %= v; }
  if (n) parts.push(h(n));
  return parts.join(" ");
}
function arWords(n) {
  const ones = ["", "واحد", "اثنان", "ثلاثة", "أربعة", "خمسة", "ستة", "سبعة", "ثمانية", "تسعة"];
  const teens = ["عشرة", "أحد عشر", "اثنا عشر", "ثلاثة عشر", "أربعة عشر", "خمسة عشر", "ستة عشر", "سبعة عشر", "ثمانية عشر", "تسعة عشر"];
  const tens = ["", "", "عشرون", "ثلاثون", "أربعون", "خمسون", "ستون", "سبعون", "ثمانون", "تسعون"];
  const hund = ["", "مائة", "مائتان", "ثلاثمائة", "أربعمائة", "خمسمائة", "ستمائة", "سبعمائة", "ثمانمائة", "تسعمائة"];
  const b100 = x => x < 10 ? ones[x] : x < 20 ? teens[x - 10] : (x % 10 ? ones[x % 10] + " و" + tens[Math.floor(x / 10)] : tens[Math.floor(x / 10)]);
  const b1000 = x => { const hh = Math.floor(x / 100), r = x % 100; return [hund[hh], r ? b100(r) : ""].filter(Boolean).join(" و"); };
  const scale = (x, one, two, few, many) => x === 1 ? one : x === 2 ? two : x <= 10 ? b1000(x) + " " + few : b1000(x) + " " + many;
  if (n === 0) return "صفر";
  const parts = [];
  const mil = Math.floor(n / 1e6), th = Math.floor((n % 1e6) / 1000), rest = n % 1000;
  if (mil) parts.push(scale(mil, "مليون", "مليونان", "ملايين", "مليون"));
  if (th) parts.push(scale(th, "ألف", "ألفان", "آلاف", "ألف"));
  if (rest) parts.push(b1000(rest));
  return parts.join(" و");
}
const CUR_WORDS = { USD: [["US dollars", "cents"], ["دولار أمريكي", "سنت"]], EUR: [["euros", "cents"], ["يورو", "سنت"]], EGP: [["Egyptian pounds", "piastres"], ["جنيه مصري", "قرش"]] };
function totalInWords(amt, cur, lang) {
  const whole = Math.floor(amt + 1e-9), frac = Math.round((amt - whole) * 100);
  const w = CUR_WORDS[cur] || [[cur, "cents"], [cur, "سنت"]];
  if (lang === "ar") return `فقط ${arWords(whole)} ${w[1][0]}` + (frac ? ` و${arWords(frac)} ${w[1][1]}` : "") + " لا غير";
  const s = enWords(whole); return s.charAt(0).toUpperCase() + s.slice(1) + " " + w[0][0] + (frac ? " and " + enWords(frac) + " " + w[0][1] : "") + " only";
}

function kpi(label, val, note = "", kind = "") { return `<div class="panel kpi"><div class="lbl">${label}</div><div class="val ${kind ? "text-" + kind : ""}">${val}</div>${note ? `<div class="note">${note}</div>` : ""}</div>`; }

function marginOf(f) { return sellTotalUSD(f) - costTotalUSD(f); }

VIEWS.dashboard = () => {
  const u = me(), open = DB.files.filter(f => f.status === "open");
  const head = pageHead(t("dash_title", { name: esc(tx(u.name)) }), isAdmin() ? t("dash_sub_admin") : t("dash_sub_role") + " · " + roleName(ROLE));
  const waiting = open.filter(f => workDaysSince(f.since) > 3);
  if (isAdmin()) {
    const profit = Object.values(DB.perf).reduce((s, p) => s + p.achieved, 0), goal = DB.users.reduce((s, x) => s + (x.target || 0), 0);
    const toCollect = DB.invoices.reduce((s, i) => s + toUSD(invTotal(i) - i.paid, i.cur), 0);
    const overdue = DB.invoices.filter(i => i.due < TODAY).reduce((s, i) => s + toUSD(invTotal(i) - i.paid, i.cur), 0);
    const max = Math.max(...STAGES.map(s => open.filter(f => f.stage === s.n).length), 1);
    const pipe = STAGES.map(s => { const c = open.filter(f => f.stage === s.n).length; return `<div class="pipe-row"><span>${stageChip(s.n)}</span><span class="pipe-bar"><span style="width:${(c / max) * 100}%"></span></span><span class="c">${c}</span></div>`; }).join("");
    const lostMax = Math.max(...DB.lostStats.map(x => x[1]));
    const lost = DB.lostStats.map(([k, n]) => `<div class="pipe-row"><span>${t(k)}</span><span class="pipe-bar"><span style="width:${(n / lostMax) * 100}%;background:var(--bad)"></span></span><span class="c">${n}</span></div>`).join("");
    const reps = ["u1", "u2", "u3"].map(id => { const p = DB.perf[id], tg = user(id).target, pc = Math.round((p.achieved / tg) * 100); return `<div class="mb-3"><div class="split small"><span>${avatar(id)} ${esc(uname(id))}</span><span class="num ltr">${money(p.achieved)} / ${money(tg)} · ${pc}%</span></div><div class="progress mt-1" style="height:8px" role="progressbar" aria-valuenow="${pc}" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar" style="width:${Math.min(pc, 100)}%"></div></div></div>`; }).join("");

    const appr = [...lowMargin.map(f => `<div class="split py-2 border-bottom"><span><a class="row-link mono" href="#file-${f.id}">${f.id}</a> · ${t("appr_margin")}</span><span>${money(marginOf(f))}</span></div>`), ...payPending.map(f => `<div class="split py-2 border-bottom"><a class="row-link mono" href="#file-${f.id}">${f.id}</a><span>${t("pay_terms")}</span></div>`)].join("") || `<div class="empty py-3">${t("none")}</div>`;
    return head + `<div class="grid g-4 mb-3">
        ${kpi(t("k_open_files"), open.length)}
        ${kpi(t("k_profit_month"), money(profit), t("k_goal", { goal: money(goal) }))}
        ${kpi(t("k_waiting"), waiting.length, t("k_waiting_note"), waiting.length ? "warning" : "")}
        ${kpi(t("k_collect"), money(toCollect), t("k_overdue_note", { amt: money(overdue) }))}
      </div>
      <div class="grid g-main mb-3">${panel(t("pipeline"), pipe)}${panel(t("profit_by_rep"), reps)}</div>

      <div class="grid g-3">${panel(t("approvals"), appr)}${panel(t("lost_reasons"), lost)}${panel(t("nav_ai"), aiSummary())}</div>`;

    const follow = DB.clients.filter(c => c.owner === u.id && c.next_follow && c.next_follow <= TODAY);

      ${panel(t("k_followups"), follow.map(c => `<div class="split py-2 border-bottom"><a class="row-link" href="#client-${c.id}">${esc(tx(c.company))}</a>${pill(t("cs_" + c.status), statusKind(c.status))}</div>`).join("") || `<div class="empty">${t("none")}</div>`)}</div>`;
  }
  if (ROLE === "pricing" || ROLE === "pricing_review") {
    const toPrice = open.filter(f => f.pricing === "pending"), review = open.filter(f => f.pricing === "review"), mails = DB.inbound.filter(m => m.status !== "confirmed");
    return head + `<div class="grid g-3 mb-3">${kpi(t("k_pricing_queue"), toPrice.length)}${kpi(t("k_rate_emails"), mails.length, "", mails.length ? "warning" : "")}${kpi(t("k_review_queue"), review.length)}</div>` + pricingDesk(true);
  }
  if (ROLE === "ops") {
    const st3 = open.filter(f => f.stage === 3), st4 = open.filter(f => f.stage === 4), blockers = open.reduce((s, f) => s + openBlockers(f), 0);
    return head + `<div class="grid g-3 mb-3">${kpi(t("k_bookings"), st3.length)}${kpi(t("k_arrivals"), st4.filter(f => f.ship?.eta && daysBetween(TODAY, f.ship.eta) <= 7).length)}${kpi(t("k_doc_blockers"), blockers, "", blockers ? "danger" : "")}</div>` + panel(t("my_queue"), filesTable([...st3, ...st4], { days: 1 }), "", true);

    return head + `<div class="grid g-3 mb-3">${kpi(t("k_clearance"), st5.length)}${kpi(t("k_release"), st5.filter(f => !f.checks.c5_release).length)}${kpi(t("k_arrivals"), arriving.length)}</div>` + panel(t("my_queue"), filesTable([...st5, ...arriving], { days: 1 }), "", true);
  }
  if (ROLE === "accounts") {
    const dueWeek = DB.invoices.filter(i => invTotal(i) > i.paid && daysBetween(TODAY, i.due) <= 7);
    const vd = DB.vendorDues.filter(d => !d.paid && daysBetween(TODAY, d.due) <= 7);
    const pt = open.filter(f => f.pay_terms && f.pay_terms.status === "pending");
    return head + `<div class="grid g-3 mb-3">${kpi(t("k_invoices_due"), dueWeek.length)}${kpi(t("k_vendor_dues"), vd.length, "", vd.length ? "warning" : "")}${kpi(t("k_payterms"), pt.length)}</div>
      <div class="grid g-2">${panel(t("client_balances"), invoiceTable(DB.invoices.filter(i => invTotal(i) > i.paid)), "", true)}${panel(t("my_queue"), filesTable(open.filter(f => f.stage === 6 || (f.stage === 5 && !f.checks.c5_release)), { days: 1 }), "", true)}</div>`;
  }
  return head;
};

FILE_TABS.pricing = f => {
  const quotes = (f.vq || []).map(id => ({ id, ...DB.vendorQuotes[id] }));
  const ranked = rankQuotes(quotes);
  const canPrice = isAdmin() || ROLE === "pricing";
  const vqTable = ranked.length ? `<div class="small-label px-3 pt-3">${t("vq_rank_note")}</div><div class="tbl-wrap"><table class="table align-middle mt-2"><thead><tr><th>#</th><th>${t("vendor")}</th><th>${t("carrier")}</th><th>${t("freight")}</th><th>${t("surcharges")}</th><th>${t("total_usd")}</th><th>${t("tt")}</th><th>${t("free_days")}</th><th>${t("validity")}</th><th>${t("why")}</th><th></th></tr></thead><tbody>
    ${ranked.map((q, i) => `<tr><td><span class="rank-badge ${i === 0 && q.ok ? "first" : ""}">${q.ok ? i + 1 : "—"}</span></td>
      <td>${esc(vendor(q.vendor).name)}<div class="small-label mono">${q.ref}</div></td><td>${esc(q.carrier)}</td><td>${money(q.freight)}</td><td>${money(q.sur)}</td><td class="fw-semibold">${money(q.total)}</td>
      <td class="num">${q.tt} ${t("days")}</td><td class="num">${q.free}</td><td class="num">${q.valid < TODAY ? pill(fdate(q.valid), "bad") : fdate(q.valid)}</td>

  const showAct = canSeeMoney();
  const costs = `<div class="tbl-wrap"><table class="table align-middle"><thead><tr><th>${t("line")}</th><th>${t("vendor")}</th><th>${t("est")}</th>${showAct ? `<th>${t("actual")}</th>` : ""}<th>${t("currency")}</th></tr></thead><tbody>
    ${(f.costs || []).map(c => `<tr><td>${t(c.type)}</td><td class="small">${esc(vendor(c.vendor)?.name || "—")}</td><td class="num">${NF.format(c.est)}</td>${showAct ? `<td class="num">${c.act != null ? NF.format(c.act) : "—"}</td>` : ""}<td>${c.cur}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">—</td></tr>`}
    <tr class="fw-semibold"><td colspan="2">${t("total")} (USD)</td><td>${money(costTotalUSD(f))}</td>${showAct ? `<td>${(f.costs || []).some(c => c.act != null) ? money(costTotalUSD(f, "act")) : "—"}</td>` : ""}<td></td></tr></tbody></table></div>`;
  const statusMap = { draft: ["pending", ""], pending: ["k_pricing_queue", "warn"], review: ["pq_review", "info"], priced: ["reviewed_ok", "ok"], won: ["c2_approval", "ok"], lost: ["s_lost", "bad"] };
  const sm = statusMap[f.pricing] || ["pending", ""];
  const reviewBtns = f.pricing === "review" && (isAdmin() || ROLE === "pricing_review") ? `<button class="btn btn-sm btn-primary" data-act="review_ok" data-file="${f.id}">${t("approve")}</button> <button class="btn btn-sm btn-light" data-act="review_back" data-file="${f.id}">${t("return")}</button>` : "";
  const sendBtns = canPrice && f.status === "open" ? `<button class="btn btn-sm btn-light" data-act="rfqvendors" data-file="${f.id}">${ico("inbox")} ${t("send_rfq_vendors")}</button>${["pending", "draft"].includes(f.pricing) && f.costs.length ? ` <button class="btn btn-sm btn-primary" data-act="toreview" data-file="${f.id}">${t("send_review")}</button>` : ""}` : "";
  const pt = f.pay_terms || { method: f.inq.pay };
  const needAcc = ["arrival", "credit"].includes(pt.method);
  const ptBox = `<div class="small mb-2">${t({ cia: "pm_cia", cad: "pm_cad", arrival: "pm_arrival", credit: "pm_credit" }[pt.method])}${pt.days ? ` · ${pt.days} ${t("days")}` : ""}</div>
    <div class="small-label mb-2">${needAcc ? t("pt_need_acc") : t("pt_skip")}</div>
    ${needAcc ? (pt.status === "approved" ? pill(t("pt_approved"), "ok") : `${pill(t("pt_pending"), "warn")} ${isAdmin() || ROLE === "accounts" ? `<button class="btn btn-sm btn-primary ms-2" data-act="ptok" data-file="${f.id}">${t("approve")}</button>` : ""}`) : ""}`;
  return `<div class="stack">${panel(t("vq_title"), vqTable, sendBtns, true)}
    <div class="grid g-main">${panel(t("cost_lines"), costs, `<span>${pill(t(sm[0]), sm[1])} ${reviewBtns}</span>`, true)}${panel(t("pay_terms"), ptBox)}</div></div>`;
};
function rankQuotes(qs) {
  return qs.map(q => ({ ...q, total: toUSD(q.freight + q.sur + q.local, q.cur), ok: q.valid >= TODAY }))
    .sort((a, b) => (b.ok - a.ok) || (a.total - b.total) || (a.tt - b.tt) || (b.free - a.free) || (b.valid > a.valid ? 1 : -1));
}

  const dueTxt = d => { const n = daysBetween(TODAY, d); return n < 0 ? pill(t("days_late", { n: -n }), "bad") : n <= 3 ? pill(t("days_left", { n }), "warn") : `<span class="small-label">${t("days_left", { n })}</span>`; };
  return pageHead(t("collections_title"), "") + `<div class="stack">${panel(t("client_balances"), `<div class="tbl-wrap"><table class="table align-middle"><thead><tr><th>${t("inv_no")}</th><th>${t("client")}</th><th>${t("balance")}</th><th>${t("due_date")}</th><th></th><th></th></tr></thead><tbody>
    ${DB.invoices.filter(i => invTotal(i) - i.paid > 0.01).sort((a, b) => a.due.localeCompare(b.due)).map(i => `<tr><td><a class="mono row-link" href="#invoice-${i.id}">${i.id}</a></td><td class="small">${esc(tx(client(i.client).company))}</td><td>${money(invTotal(i) - i.paid, i.cur, 1)}</td><td class="num">${fdate(i.due)}</td><td>${dueTxt(i.due)}</td><td><button class="btn btn-sm btn-light" data-act="pay" data-inv="${i.id}">${t("record_payment")}</button></td></tr>`).join("")}</tbody></table></div>`, "", true)}
    ${panel(t("vendor_due"), `<div class="tbl-wrap"><table class="table align-middle"><thead><tr><th>${t("vendor")}</th><th>${t("file_no")}</th><th>${t("amount")}</th><th>${t("due_date")}</th><th></th><th></th></tr></thead><tbody>
    ${DB.vendorDues.map((d, i) => `<tr><td>${esc(vendor(d.vendor).name)}</td><td class="mono"><a href="#file-${d.file}">${d.file}</a></td><td>${money(d.amt, d.cur)}</td><td class="num">${fdate(d.due)}</td><td>${d.paid ? pill(t("paid"), "ok") : dueTxt(d.due)}</td><td>${d.paid ? "" : `<button class="btn btn-sm btn-light" data-act="payvendor" data-i="${i}">${t("pay_vendor")}</button>`}</td></tr>`).join("")}</tbody></table></div>`, "", true)}</div>`;
};
HANDLERS.payvendor = a => { DB.vendorDues[+a.dataset.i].paid = true; saveState(); render(); };

// ---------- Performance ----------
VIEWS.performance = () => {
  const ids = isAdmin() ? ["u1", "u2", "u3"] : [me().id];
  return pageHead(t("perf_title"), t("perf_sub")) + `<section class="panel"><div class="tbl-wrap"><table class="table align-middle"><thead><tr><th>${t("sales_owner")}</th><th>${t("target")}</th><th>${t("achieved")}</th><th style="min-width:140px">%</th><th>${t("commission")}</th><th>${t("files_won")}</th><th>${t("leads_handled")}</th><th>${t("self_review")}</th><th>${t("mgr_review")}</th></tr></thead><tbody>
  ${ids.map(id => { const u = user(id), p = DB.perf[id], pc = Math.round((p.achieved / u.target) * 100); return `<tr><td>${avatar(id)} ${esc(tx(u.name))}</td><td>${money(u.target)}</td><td class="fw-semibold">${money(p.achieved)}</td>
    <td><div class="progress" style="height:8px" role="progressbar" aria-valuenow="${pc}" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar" style="width:${Math.min(pc, 100)}%"></div></div><span class="small-label num">${pc}%</span></td>
    <td>${u.commission ? money(p.achieved * u.commission / 100) + ` <span class="small-label">(${u.commission}%)</span>` : "—"}</td><td class="num">${p.files}</td><td class="num">${p.leads}</td><td>${p.self ? pill(t("submitted"), "ok") : pill(t("pending"), "warn")}</td><td>${p.mgr ? pill(t("submitted"), "ok") : pill(t("pending"), "warn")}</td></tr>`; }).join("")}</tbody></table></div></section>`;
};

// ---------- Users ----------
const ALL_ROLES = ["admin", "sales", "pricing", "pricing_review", "ops", "customs", "accounts"];
VIEWS.users = () => pageHead(t("users_title"), t("users_sub")) + `<div class="ai-box mb-3 small">${t("admin_note")}</div><section class="panel"><div class="tbl-wrap"><table class="table align-middle"><thead><tr><th>${t("name")}</th><th>${t("initials")}</th><th>${t("roles")}</th><th>${t("target")}</th><th>${t("commission")}</th><th>${t("gets_leads")}</th></tr></thead><tbody>
  ${DB.users.map(u => `<tr><td>${avatar(u.id)} ${esc(tx(u.name))}<div class="small-label ltr">${esc(u.email)}</div></td><td class="mono">${u.initials}</td>
    <td style="min-width:260px">${u.roles.length ? "" : pill(t("no_roles"), "bad") + "<br>"}<div class="d-flex flex-wrap gap-1 mt-1">${ALL_ROLES.map(r => `<input type="checkbox" class="btn-check" id="ur-${u.id}-${r}" ${u.roles.includes(r) ? "checked" : ""} data-change="urole" data-u="${u.id}" data-r="${r}"><label class="btn btn-sm btn-outline-primary py-0" for="ur-${u.id}-${r}">${roleName(r)}</label>`).join("")}</div></td>
    <td>${u.roles.includes("sales") ? money(u.target) : "—"}</td><td>${u.roles.includes("sales") ? (u.commission || 0) + "%" : "—"}</td>
    <td><div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="gl-${u.id}" ${u.gets_leads ? "checked" : ""} data-change="uleads" data-u="${u.id}" aria-label="${t("gets_leads")}"></div></td></tr>`).join("")}</tbody></table></div></section>`;
HANDLERS.urole = el => { const u = user(el.dataset.u); u.roles = el.checked ? [...u.roles, el.dataset.r] : u.roles.filter(r => r !== el.dataset.r); saveState(); render(); };
HANDLERS.uleads = el => { user(el.dataset.u).gets_leads = el.checked; saveState(); };

// ---------- Settings ----------
VIEWS.config = () => {
  const s = DB.settings, ai = s.ai;
  return pageHead(t("config_title"), "") + `<div class="grid g-2">
    ${panel(t("cfg_margin"), `<div class="input-group" style="max-width:240px"><span class="input-group-text">$</span><input id="cfg-margin" type="number" min="0" class="form-control num" value="${s.minMargin}" data-change="cfgmargin"></div>`)}
    ${panel(t("cfg_ai"), `<div class="small-label mb-2">${t("ai_model")}: <span class="mono">${esc(ai.model)}</span></div>
      ${["f1", "f2", "f3"].map(k => `<div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" role="switch" id="cfg-${k}" ${ai[k] ? "checked" : ""} data-change="cfgai" data-k="${k}"><label class="form-check-label" for="cfg-${k}">${t("ai_" + k)}</label></div>`).join("")}
      <label class="form-label mt-2" for="cfg-ailimit">${t("ai_limit")}</label><input id="cfg-ailimit" type="number" min="0" class="form-control num" style="max-width:160px" value="${ai.limit}" data-change="cfgailimit"><div class="small-label mt-1">${t("ai_spent")}: ${money(ai.spent, "USD", 1)}</div>`)}
    ${panel(t("cfg_rates"), `<div class="tbl-wrap"><table class="table align-middle"><thead><tr><th>${t("currency")}</th><th>1 USD =</th><th>${t("status")}</th><th></th></tr></thead><tbody>${Object.entries(DB.rates).map(([c, r]) => `<tr><td class="mono">${c}</td><td><input type="number" step="0.0001" class="form-control form-control-sm num" style="max-width:130px" value="${r.v}" ${r.locked ? "" : "disabled"} data-change="cfgrate" data-c="${c}" aria-label="${c}"></td><td>${r.locked ? pill(t("locked_rate"), "warn") : pill(t("auto"), "ok")}</td><td><button class="btn btn-sm btn-light" data-act="lockrate" data-c="${c}">${r.locked ? t("unlock") : t("lock")}</button></td></tr>`).join("")}</tbody></table></div><div class="small-label p-3">${t("updated_daily")}</div>`, "", true)}
    ${panel(t("cfg_bank"), Object.entries(BANKS).map(([c, b]) => `<div class="mb-2"><span class="mono fw-semibold">${c}</span> <span class="small ltr">${b.filter(Boolean).join(" · ")}</span></div>`).join("") + `<div class="small-label mt-2">${t("cfg_company")}: ${t("tax_reg")} · ${t("cr_no")}</div>`)}</div>`;
};
HANDLERS.cfgmargin = el => { DB.settings.minMargin = +el.value || 0; saveState(); toast(t("saved")); };
HANDLERS.cfgai = el => { DB.settings.ai[el.dataset.k] = el.checked; saveState(); toast(t("saved")); };
HANDLERS.cfgailimit = el => { DB.settings.ai.limit = +el.value || 0; saveState(); toast(t("saved")); };
HANDLERS.cfgrate = el => { DB.rates[el.dataset.c].v = +el.value; saveState(); toast(t("saved")); };
HANDLERS.lockrate = a => { const r = DB.rates[a.dataset.c]; r.locked = !r.locked; saveState(); render(); };

// ---------- AI usage ----------
VIEWS.ai = () => pageHead(t("nav_ai"), "") + `<div class="grid g-main"><section class="panel"><div class="panel-h"><h2>${t("ai_runs")}</h2></div><div class="tbl-wrap"><table class="table align-middle"><thead><tr><th>${t("date")}</th><th>${t("feature")}</th><th>${t("owner")}</th><th>${t("file_no")}</th><th>${t("tokens")}</th><th>${t("cost_usd")}</th><th>${t("run_status")}</th></tr></thead><tbody>
  ${DB.aiRuns.map(r => `<tr><td class="num small">${fdate(r.at)}</td><td class="small">${t(r.f)}</td><td>${avatar(r.user)}</td><td class="mono small">${r.file ? `<a href="#file-${r.file}">${r.file}</a>` : "—"}</td><td class="num">${NF.format(r.tokens)}</td><td class="num">${NF2.format(r.cost)}</td><td>${pill(t(r.status), { rs_accepted: "ok", rs_rejected: "bad", rs_failed: "bad", rs_done: "info" }[r.status])}</td></tr>`).join("")}</tbody></table></div></section>${panel(t("cfg_ai"), aiSummary())}</div>`;

try { loadState(); } catch (e) { DB = clone(SEED); }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
render();
</script>
